spring.application.name=Ecommerce

# Server Port (Render sets dynamic PORT env var)
server.port=${PORT:8080}

# Database Configurations - Uses Render Environment Variables on Server (PostgreSQL), falls back to MySQL on Localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/EcommerceWeb_side?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:221579}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Uploaded images directory
project.image=${PROJECT_IMAGE_PATH:images/}

# Mail Configurations - Driven by env vars for deployment security
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:rockh7189@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ncafnqcmhoxyhjts}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart Upload Limits (Allows large images & Base64 uploads without 500 error)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
