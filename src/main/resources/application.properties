spring.application.name=Ecommerce

# Server Port (Render sets dynamic PORT env var)
server.port=${PORT:8080}

# Database Configurations - Supports Automatic Render Database & Fallbacks
# Uses DB_HOST, DB_PORT, DB_NAME if set by Render Blueprint, otherwise falls back to SPRING_DATASOURCE_URL or localhost MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:EcommerceWeb_side}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Uploaded images directory
project.image=${PROJECT_IMAGE_PATH:images/}

# Mail Configurations - Driven by env vars for deployment security
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:rockh7189@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ncafnqcmhoxyhjts}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.servlet.multipart.enabled=true
