databases:
  - name: ksleep-db
    databaseName: ksleep_db
    user: ksleep_user
    plan: free
    region: singapore

services:
  - type: web
    name: ksleep-ecommerce
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: ksleep-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ksleep-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ksleep-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ksleep-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ksleep-db
          property: password
      - key: SPRING_MAIL_USERNAME
        value: rockh7189@gmail.com
      - key: SPRING_MAIL_PASSWORD
        value: ncafnqcmhoxyhjts
      - key: JWT_SECRET
        generateValue: true
